{% extends 'tienda/base.html' %}
{% block title %}Agregar Usuario{% endblock %}

{% block content %}
    <h1 class="h2 mb-4">Agregar Nuevo Usuario</h1>

    <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">ID Usuario (PK)</label>
                    <input type="number" class="form-control" name="IdUsuario" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" class="form-control" name="Nombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" name="Password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select class="form-select" name="Rol">
                        <option value="Empleado">Empleado</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="text-end">
                    <a href="{% url 'usuarios_lista' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
