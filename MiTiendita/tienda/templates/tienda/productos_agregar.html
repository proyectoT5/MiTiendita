{% extends 'tienda/base.html' %}
{% block title %}Agregar Producto{% endblock %}

{% block content %}
    <h1 class="h2 mb-4">Agregar Nuevo Producto</h1>

    <div class="card shadow-sm" style="max-width: 800px; margin: 0 auto;">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">ID del Producto (PK)</label>
                        <input type="number" class="form-control" name="Id_Producto" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cantidad en Inventario</label>
                        <input type="number" class="form-control" name="Cantidad" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" class="form-control" name="Nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Stock Mínimo</label>
                        <input type="number" class="form-control" name="StockMinimo" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Precio de Venta (C$)</label>
                        <input type="number" step="0.01" class="form-control" name="PrecioVenta" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Foto del Producto</label>
                        <input class="form-control" type="file" name="foto_del_producto" accept="image/*">
                    </div>
                </div>

                <div class="text-end">
                    <a href="{% url 'productos_lista' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
