{% extends 'tienda/base.html' %}
{% load static %}

{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="m-0"><i class="fas fa-plus-circle"></i> Agregar Nuevo Producto</h3>
        </div>
        <div class="card-body">
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 border-end">
                        <h5 class="text-primary mb-3"><i class="fas fa-tag"></i> Datos de Venta</h5>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Producto:</label>
                            <input type="text" name="nombre" class="form-control form-control-lg" placeholder="Ej: Jabón de baño" required autofocus>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio de Venta (C$):</label>
                                <input type="number" step="0.01" name="precio_venta" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock Inicial:</label>
                                <input type="number" name="cantidad" class="form-control" placeholder="0" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Foto del Producto:</label>
                            <input type="file" name="foto" class="form-control" accept="image/*">
                            <small class="text-muted">Se verá en la facturación.</small>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <h5 class="text-success mb-3"><i class="fas fa-truck"></i> Datos de Compra</h5>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Proveedor:</label>
                            <select name="id_proveedor" class="form-select" required>
                                <option value="" selected disabled>-- Selecciona un Proveedor --</option>
                                {% for prov in proveedores %}
                                    <option value="{{ prov.id_Proveedor }}">{{ prov.nombre_proveedor }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">¿Cuántas unidades trae el paquete/caja?</label>
                            <input type="number" name="cantidad_compra" class="form-control" placeholder="Ej: 12 (si es docena), 24, etc." value="1">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Costo de Compra del Paquete (C$):</label>
                            <input type="number" step="0.01" name="precio_compra" class="form-control" placeholder="0.00">
                            <small class="text-muted">Precio al que te lo da el proveedor.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-danger">Stock Mínimo (Alerta):</label>
                            <input type="number" name="stock_min" class="form-control" value="5">
                        </div>
                    </div>
                </div>

                <hr>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'productos_lista' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary btn-lg px-5">
                        <i class="fas fa-save"></i> Guardar Producto
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
