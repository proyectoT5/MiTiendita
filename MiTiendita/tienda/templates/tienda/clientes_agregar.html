{% extends 'tienda/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4 text-dark">Agregar Nuevo Cliente</h2>
            <div class="card shadow-sm border-0" style="border-radius: 15px;">
                <div class="card-body p-5">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" name="nombre" class="form-control form-control-lg bg-light border-0" required style="border-radius: 10px;">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Apellido</label>
                                <input type="text" name="apellido" class="form-control form-control-lg bg-light border-0" style="border-radius: 10px;">
                            </div>
                            <div class="col-md-12 mb-4">
                                <label class="form-label fw-bold">Correo (Opcional)</label>
                                <input type="email" name="correo" class="form-control form-control-lg bg-light border-0" placeholder="ejemplo@correo.com" style="border-radius: 10px;">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold text-primary">Teléfono Principal</label>
                                <input type="text" name="tel1" class="form-control form-control-lg bg-light border-0 input-tel-cliente" placeholder="0000-0000" maxlength="9" style="border-radius: 10px;">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold text-muted">Teléfono Secundario</label>
                                <input type="text" name="tel2" class="form-control form-control-lg bg-light border-0 input-tel-cliente" placeholder="Opcional" maxlength="9" style="border-radius: 10px;">
                            </div>
                        </div>
                        <div class="d-flex justify-content-end mt-3 gap-2">
                            <a href="{% url 'clientes_lista' %}" class="btn btn-secondary btn-lg px-4" style="border-radius: 10px;">Cancelar</a>
                            <button type="submit" class="btn btn-primary btn-lg px-4" style="border-radius: 10px;">Guardar Cliente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Script para poner el guion automático en Clientes
    document.querySelectorAll('.input-tel-cliente').forEach(function(el) {
        el.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,4})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2];
        });
    });
</script>
{% endblock %}
