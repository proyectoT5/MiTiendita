{% extends 'tienda/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4 fw-bold">Agregar Nuevo Proveedor</h2>
            
            <div class="card shadow-sm border-0 card-custom" style="border-radius: 15px;">
                <div class="card-body p-5">
                    <form method="POST" id="formProveedor">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-12 mb-4">
                                <label class="form-label fw-bold">Nombre de la Empresa</label>
                                <input type="text" name="nombre_proveedor" class="form-control form-control-lg border-0 shadow-sm" required style="border-radius: 10px;">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Correo (Opcional)</label>
                                <input type="email" name="correo" class="form-control form-control-lg border-0 shadow-sm" style="border-radius: 10px;">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Dirección</label>
                                <input type="text" name="Direccion" class="form-control form-control-lg border-0 shadow-sm" style="border-radius: 10px;">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Teléfono Principal</label>
                                <input type="text" name="numero_telefono_P_1" class="form-control form-control-lg border-0 shadow-sm input-tel" placeholder="0000-0000" maxlength="9" style="border-radius: 10px;">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold text-muted">Teléfono Secundario</label>
                                <input type="text" name="numero_telefono_P_2" class="form-control form-control-lg border-0 shadow-sm input-tel" placeholder="0000-0000" maxlength="9" style="border-radius: 10px;">
                            </div>
                        </div>
                        <div class="d-flex justify-content-end mt-3 gap-2">
                            <a href="{% url 'proveedores_lista' %}" class="btn btn-secondary btn-lg px-4" style="border-radius: 10px;">Cancelar</a>
                            <button type="submit" class="btn btn-primary btn-lg px-4" style="border-radius: 10px;">Guardar Proveedor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Lógica para poner el guion automático mientras escribes
    document.querySelectorAll('.input-tel').forEach(function(el) {
        el.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,4})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2];
        });
    });
</script>
{% endblock %}
