{% load static %}
<style>
    .billete-card {
        transition: transform 0.2s;
        border: 2px solid transparent;
        border-radius: 12px;
        overflow: hidden;
    }
    .billete-card:focus-within {
        transform: scale(1.05);
        border-color: #0d6efd; 
        box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }
    .img-billete {
        width: 100%;
        height: 90px;
        object-fit: contain;
        background-color: rgba(0,0,0,0.05); 
        padding: 5px;
    }
    [data-bs-theme="dark"] .img-billete {
        background-color: rgba(255,255,255,0.05);
    }
</style>

<div class="row g-3 px-2">

        <h5 class="fw-bold text-primary border-bottom border-primary pb-2"><i class="fas fa-money-bill-wave"></i> Córdobas (C$)</h5>
    </div>

    <div class="col-6 col-sm-4 col-md-3">
        <div class="card billete-card shadow-sm card-custom">
            <img src="{% static 'billetes/1000c.jpg' %}" class="card-img-top img-billete" alt="C$ 1000">
            <div class="card-body p-2 text-center bg-transparent">
                <label class="fw-bold mb-1 fs-6">C$ 1000</label>
                <input type="number" min="0" class="form-control form-control-lg text-center calc-cordoba border-secondary bg-transparent fw-bold" data-valor="1000" placeholder="Cant.">
            </div>
        </div>
    </div>
