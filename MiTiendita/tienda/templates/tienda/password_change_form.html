<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | Mi Tiendita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #e9ecef; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark"><i class="fas fa-store text-primary"></i> Mi Tiendita</h2>
                </div>

                <div class="card shadow-lg border-warning border-top border-3">
                    <div class="card-header bg-white text-center py-3 border-0">
                        <h4 class="mb-0 fw-bold text-warning"><i class="fas fa-key me-2"></i>Nueva Clave</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} small">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Escribí tu nueva contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                                    <input type="password" name="pass1" class="form-control" placeholder="******" required minlength="4">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold">Confirmala de nuevo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-check-circle"></i></span>
                                    <input type="password" name="pass2" class="form-control" placeholder="******" required minlength="4">
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-warning fw-bold text-dark">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
