<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | Mi Tiendita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #e9ecef;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark"><i class="fas fa-store text-primary"></i> Mi Tiendita</h2>
                </div>

                <div class="card shadow-lg">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h5 class="mb-0 fw-bold">Establecer Nueva Contraseña</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show small mb-3">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Nueva Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Confirmar Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fas fa-check-double text-muted"></i></span>
                                    <input type="password" name="confirm_password" class="form-control" placeholder="Repetí tu contraseña" required>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success fw-bold">Actualizar Contraseña</button>
                                <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                            </div>
                        </form>

                    </div>
                </div>
                
                <div class="text-center mt-3 text-muted small">
                    &copy; {% now "Y" %} Mi Tiendita Sistema
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
