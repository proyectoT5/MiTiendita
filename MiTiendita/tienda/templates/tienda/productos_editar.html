{% extends 'tienda/base.html' %}
{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Editar Producto: {{ producto.Nombre }}</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <input type="hidden" name="rutaFotoActual" value="{{ producto.rutaFoto }}">

                <div class="row mb-3">
                    <div class="col-md-2">
                        <label class="form-label fw-bold">ID (Fijo)</label>
                        <input type="number" class="form-control" value="{{ producto.Id_Producto }}" disabled readonly>
                        <input type="hidden" name="Id_Producto" value="{{ producto.Id_Producto }}">
                    </div>
                    <div class="col-md-10">
                        <label for="Nombre" class="form-label fw-bold">Nombre del Producto</label>
                        <input type="text" class="form-control" id="Nombre" name="Nombre" value="{{ producto.Nombre }}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="PrecioVenta" class="form-label fw-bold">Precio de Venta</label>
                        <div class="input-group">
                            <span class="input-group-text">C$</span>
                            <input type="number" step="0.01" class="form-control" id="PrecioVenta" name="PrecioVenta" value="{{ producto.PrecioVenta }}" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="Cantidad" class="form-label fw-bold">Existencias (Stock)</label>
                        <input type="number" class="form-control" id="Cantidad" name="Cantidad" value="{{ producto.Cantidad }}" required>
                    </div>
                    <div class="col-md-4">
                        <label for="StockMinimo" class="form-label fw-bold">Stock Mínimo</label>
                        <input type="number" class="form-control" id="StockMinimo" name="StockMinimo" value="{{ producto.StockMinimo }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="foto_del_producto" class="form-label fw-bold">Imagen del Producto</label>
                    <input class="form-control" type="file" id="foto_del_producto" name="foto_del_producto" accept="image/*">
                    {% if producto.rutaFoto %}
                        <div class="mt-2 p-2 border rounded bg-light d-inline-block">
                            <small class="text-muted d-block mb-1">Imagen actual:</small>
                            <img src="{{ producto.rutaFoto }}" alt="Foto actual" style="height: 80px; border-radius: 5px;">
                        </div>
                    {% endif %}
                </div>

                <div class="text-end">
                    <a href="{% url 'productos_lista' %}" class="btn btn-secondary">Cancelar</a>
                    
                    <button type="submit" class="btn btn-warning fw-bold">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
