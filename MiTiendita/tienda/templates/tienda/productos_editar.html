{% extends 'tienda/base.html' %}
{% block title %}Editar Producto{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<h1 class="h2 mb-4">Editar Producto: {{ producto.Nombre }}</h1>

<div class="card shadow-sm" style="max-width: 900px; margin: 0 auto;">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="rutaFotoActual" value="{{ producto.rutaFoto }}">
            
            <div class="row">
                <div class="col-md-7">
                    <h5 class="text-primary mb-3"><i class="fas fa-tag"></i> Datos de Venta</h5>
                    <div class="mb-3">
                        <label class="small fw-bold">Nombre del Producto</label>
                        <input type="text" name="Nombre" class="form-control" value="{{ producto.Nombre }}" required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="small fw-bold">Precio Venta (C$)</label>
                            <input type="number" step="0.01" name="PrecioVenta" class="form-control" value="{{ producto.PrecioVenta }}" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="small fw-bold">Stock Actual</label>
                            <input type="number" name="Cantidad" class="form-control" value="{{ producto.Cantidad }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Foto</label>
                        <div class="mb-2">
                            {% if producto.rutaFoto %}<img src="{{ producto.rutaFoto }}" alt="Foto" style="width: 80px; border-radius: 5px;">{% endif %}
                        </div>
                        <input type="file" name="foto_del_producto" class="form-control" accept="image/*">
                    </div>
                </div>

                <div class="col-md-5 border-start">
                    <h5 class="text-success mb-3"><i class="fas fa-truck"></i> Datos de Compra</h5>
                    <div class="mb-3">
                        <label class="small fw-bold">Proveedor</label>
                        <select class="form-select" name="id_proveedor" id="select-proveedor" required>
                            <option value="">-- Buscar --</option>
                            {% for prov in proveedores %}
                                <option value="{{ prov.id_Proveedor }}" {% if prov.id_Proveedor == producto.IdProveedor %}selected{% endif %}>{{ prov.nombre_proveedor }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Unidades por Paquete</label>
                        <input type="number" name="cantidad_compra" class="form-control" value="{{ producto.CantidadCompra|default:1 }}">
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Costo de Compra (C$)</label>
                        <input type="number" step="0.01" name="precio_compra" class="form-control" value="{{ producto.PrecioCompra|default:0.00 }}">
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Stock Mínimo</label>
                        <input type="number" name="StockMinimo" class="form-control" value="{{ producto.StockMinimo }}">
                    </div>
                </div>
            </div>

            <div class="text-end mt-4">
                <a href="{% url 'productos_lista' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary fw-bold px-4">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block content_scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() { $('#select-proveedor').select2({ placeholder: "Buscar...", allowClear: true }); });
</script>
{% endblock %}
