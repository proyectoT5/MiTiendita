{% extends 'tienda/base.html' %}
{% block title %}Asignar Costo a Producto{% endblock %}

{% block content %}
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">Asignar Proveedor y Costo</h1>
        <a href="{% url 'proveedor_producto_lista' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver a la lista
        </a>
    </div>

    <div class="card shadow-sm" style="max-width: 700px; margin: 0 auto;">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="form-label fw-bold">1. Seleccioná el Producto</label>
                    <select class="form-select select2-busqueda" name="id_producto" required style="width: 100%;">
                        <option value="" selected disabled>-- Escribí para buscar producto --</option>
                        {% for p in productos %}
                            <option value="{{ p.Id_Producto }}">{{ p.Nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">2. Seleccioná el Proveedor</label>
                    <select class="form-select select2-busqueda" name="id_proveedor" required style="width: 100%;">
                        <option value="" selected disabled>-- Escribí para buscar proveedor --</option>
                        {% for prov in proveedores %}
                            <option value="{{ prov.id_Proveedor }}">{{ prov.nombre_proveedor }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">3. Cantidad por Paquete</label>
                        <input type="number" class="form-control" name="cantidad_compra" placeholder="Ej: 12 (Docena)" required>
                        <div class="form-text">¿Cuántas unidades trae el bulto?</div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">4. Costo de Compra (C$)</label>
                        <div class="input-group">
                            <span class="input-group-text">C$</span>
                            <input type="number" step="0.01" class="form-control" name="precio_compra" placeholder="0.00" required>
                        </div>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="submit" class="btn btn-primary btn-lg px-5">Guardar Asignación</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}

{% block content_scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {
        $('.select2-busqueda').select2({
            placeholder: "Buscar...",
            allowClear: true
        });
    });
</script>
{% endblock %}
