<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado | Mi Tiendita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #e9ecef; /* El mismo gris de tu Login */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark"><i class="fas fa-store text-primary"></i> Mi Tiendita</h2>
                </div>

                <div class="card shadow-lg text-center">
                    <div class="card-body p-5">
                        
                        <div style="font-size: 60px; color: #198754; margin-bottom: 20px;">
                            <i class="fas fa-check-circle"></i>
                        </div>

                        <h2 class="card-title fw-bold mb-3">¡Correo Enviado!</h2>
                        
                        <p class="card-text text-muted mb-4">
                            Hemos enviado las instrucciones para recuperar tu cuenta a tu correo electrónico.
                        </p>

                        <div class="alert alert-light border small text-muted">
                            <i class="fas fa-info-circle me-1"></i> Revisa tu bandeja de entrada (y Spam).
                        </div>

                        <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-3 fw-bold">
                            Volver al Login
                        </a>

                    </div>
                </div>

                <div class="text-center mt-3 text-muted small">
                    &copy; {% now "Y" %} Mi Tiendita Sistema
                </div>

            </div>
        </div>
    </div>

</body>
</html>
