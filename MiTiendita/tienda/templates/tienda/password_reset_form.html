<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acceso | Mi Tiendita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #e9ecef; /* Fondo gris suave sugerido en tu diseño */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border: none; border-radius: 10px; }
        .alert { font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">
                        <i class="fas fa-store text-primary"></i> Mi Tiendita
                    </h2>
                </div>

                <div class="card shadow-lg">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h5 class="mb-0 fw-bold">Recuperar Contraseña</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-3">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <p class="text-muted text-center small mb-4">
                            Ingresá tu correo y te enviaremos un enlace seguro para restablecer tu cuenta.
                        </p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="fas fa-envelope text-muted"></i>
                                    </span>
                                    <input type="email" name="correo" class="form-control" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary fw-bold">Enviar Enlace</button>
                            </div>
                        </form>

                        <div class="text-center border-top pt-3">
                            <a href="{% url 'login' %}" class="text-decoration-none small fw-bold text-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Volver al Login
                            </a>
                        </div>

                    </div>
                </div>
                
                <div class="text-center mt-3 text-muted small">
                    &copy; {% now "Y" %} Mi Tiendita Sistema
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
