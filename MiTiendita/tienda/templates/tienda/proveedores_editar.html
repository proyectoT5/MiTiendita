{% extends 'tienda/base.html' %}
{% block title %}Editar Proveedor{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Editar Proveedor: {{ proveedor.nombre_proveedor }}</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" id="formProveedorEditar" novalidate>
                {% csrf_token %}
                
                <div class="row mb-3">
                    <div class="col-md-2">
                        <label class="form-label fw-bold">ID</label>
                        <input type="number" class="form-control" value="{{ proveedor.id_Proveedor }}" disabled readonly>
                        <input type="hidden" name="id_Proveedor" value="{{ proveedor.id_Proveedor }}">
                    </div>
                    <div class="col-md-10">
                        <label class="form-label fw-bold">Nombre de la Empresa</label>
                        <input type="text" class="form-control" name="nombre_proveedor" value="{{ proveedor.nombre_proveedor }}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Correo</label>
                        <input type="email" class="form-control" id="inputCorreoEditar" name="correo" value="{{ proveedor.correo|default:'' }}">
                        <div class="invalid-feedback">Correo inválido.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Dirección</label>
                        <input type="text" class="form-control" name="Direccion" value="{{ proveedor.Direccion|default:'' }}">
                    </div>
                </div>

                <hr>
                <h5 class="text-muted">Teléfonos</h5>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Teléfono Principal</label>
                        <input type="text" class="form-control" name="numero_telefono_P_1" 
                               value="{{ telefono_1 }}" placeholder="8888-8888" maxlength="9"
                               oninput="formatoTelefono(this)">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono Secundario</label>
                        <input type="text" class="form-control" name="numero_telefono_P_2" 
                               value="{{ telefono_2 }}" placeholder="2222-2222" maxlength="9"
                               oninput="formatoTelefono(this)">
                    </div>
                </div>

                <div class="text-end">
                    <a href="{% url 'proveedores_lista' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block content_scripts %}
<script>
    // 1. FORMATO TELEFONO
    function formatoTelefono(input) {
        let numero = input.value.replace(/\D/g, '');
        if (numero.length > 8) { numero = numero.substring(0, 8); }
        if (numero.length > 4) {
            input.value = numero.substring(0, 4) + '-' + numero.substring(4);
        } else {
            input.value = numero;
        }
    }

    // 2. Validación Correo
    const form = document.getElementById('formProveedorEditar');
    const correoInput = document.getElementById('inputCorreoEditar');
    const dominiosValidos = ['gmail.com', 'hotmail.com', 'yahoo.com', 'outlook.com', 'live.com', 'icloud.com', 'yahoo.es', 'hotmail.es', 'outlook.es'];

    form.addEventListener('submit', function(event) {
        const correo = correoInput.value.trim().toLowerCase();
        if (correo.length > 0) {
            let esValido = false;
            for (let dominio of dominiosValidos) {
                if (correo.endsWith('@' + dominio)) { esValido = true; break; }
            }
            if (!esValido) {
                event.preventDefault();
                event.stopPropagation();
                correoInput.classList.add('is-invalid');
            } else {
                correoInput.classList.remove('is-invalid');
            }
        }
    });
    correoInput.addEventListener('input', function() {
        if (this.classList.contains('is-invalid')) { this.classList.remove('is-invalid'); }
    });
</script>
{% endblock %}
