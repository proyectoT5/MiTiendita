{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">
    <title>Establecer Nueva Contraseña</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .card-restablecer {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: white;
        }
        .icono { font-size: 3.5rem; color: #1e3c72; text-align: center; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div class="card-restablecer">
    <div class="icono"><i class="fas fa-lock-open"></i></div>
    <h3 class="fw-bold text-primary text-center mb-2">Nueva Contraseña</h3>
    <p class="text-muted text-center small mb-4">Ingresa tu nueva clave de acceso para el usuario <strong>{{ username }}</strong></p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger alert-dismissible fade show small p-2" role="alert">
                <i class="fas fa-exclamation-circle me-1"></i> {{ message }}
                <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="text-start">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Contraseña Nueva</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-key text-muted"></i></span>
                <input type="password" name="nueva_password" class="form-control" placeholder="Mínimo 4 caracteres" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Confirmar Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-check text-muted"></i></span>
                <input type="password" name="confirmar_password" class="form-control" placeholder="Repite la contraseña" required>
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-bold" style="background: #1e3c72; border: none;">
                <i class="fas fa-save me-2"></i> Guardar y Entrar
            </button>
        </div>
    </form>
</div>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
