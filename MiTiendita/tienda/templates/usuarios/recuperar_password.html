{% load static %}
<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- Bootstrap -->
<link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">

<!-- FontAwesome -->
<link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">

<title>Recuperar Contraseña</title>

<style>
    body {
        background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    .card-recuperar {
        width: 100%;
        max-width: 420px;
        padding: 2.5rem;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        background: white;
        text-align: center;
    }

    .icono {
        font-size: 3.5rem;
        color: #0d6efd;
        margin-bottom: 1rem;
    }
</style>


</head>

<body>

<div class="card-recuperar">


<div class="icono">
    <i class="fas fa-key"></i>
</div>

<h3 class="fw-bold text-primary mb-2">Recuperar contraseña</h3>
<p class="text-muted mb-4">Ingresa tu usuario para generar el código OTP</p>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger alert-dismissible fade show text-start" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

<form method="POST" class="text-start">
    {% csrf_token %}

    <div class="mb-4">
        <label class="form-label fw-bold">Usuario</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="fas fa-user"></i>
            </span>
            <input type="text" name="username" class="form-control" placeholder="Ej: admin" required>
        </div>
    </div>

    <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg fw-bold">
            <i class="fas fa-qrcode me-2"></i> Generar código
        </button>
    </div>
</form>

<div class="mt-4">
    <a href="{% url 'login' %}" class="text-decoration-none text-muted">
        <i class="fas fa-arrow-left me-1"></i> Volver al login
    </a>
</div>


</div>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
